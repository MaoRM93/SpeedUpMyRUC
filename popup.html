<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    width: 280px;
    font: 13px/18px -apple-system, "PingFang SC", sans-serif;
    color: #1d1d1f;
    background: #fff;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 12px 14px 9px;
  }
  header .t { font-size: 13px; font-weight: 600; }
  header .v { font-size: 11px; color: #86868b; font-variant-numeric: tabular-nums; }
  main { max-height: 510px; overflow-y: auto; }
  section { border-top: 1px solid #e5e5ea; padding: 5px 0 6px; }
  .g, .i {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .g { padding: 4px 14px; font-size: 11px; color: #86868b; }
  .i { padding: 3px 14px 3px 27px; }
  .i:hover { background: #f5f5f7; }
  .l { flex: 1; }
  .n { font-size: 11px; color: #86868b; font-variant-numeric: tabular-nums; }
  input {
    margin: 0;
    width: 13px;
    height: 13px;
    flex: none;
    accent-color: #007aff;
  }
  footer {
    border-top: 1px solid #e5e5ea;
    padding: 8px 14px 10px;
    font-size: 11px;
    color: #86868b;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f5f5f7; background: #1e1e1e; }
    section, footer { border-color: #3a3a3c; }
    .i:hover { background: #2c2c2e; }
    header .v, .g, .n, footer { color: #98989d; }
  }
</style>
</head>
<body>
  <header>
    <span class="t">SpeedUpMyRUC</span>
    <span class="v">101.0.0.100</span>
  </header>
  <main id="list"></main>
  <footer>勾选即时生效，无需刷新</footer>
  <script src="items.js"></script>
  <script src="popup.js"></script>
</body>
</html>
